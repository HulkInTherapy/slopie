name: Candidate validation
on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sqlite: [node, better-sqlite3]
    env:
      POTSHERD_SQLITE: ${{ matrix.sqlite }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm privacy
      - run: pnpm vendor
      - name: the vendored plugins start and serve the four memory tools
        run: |
          for p in claude-code codex; do
            sh plugins/$p/bin/potsherd --version
            printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | sh plugins/$p/bin/potsherd mcp | grep -q '"name":"grep"'
          done
